name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build multi-platform binaries
        run: |
          set -euo pipefail
          mkdir -p dist
          build() {
            local goos="$1" goarch="$2" out="$3"
            echo "building dist/${out}"
            GOOS="$goos" GOARCH="$goarch" CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" -o "dist/${out}" .
          }
          build linux amd64 plumelog_linux_amd64
          build linux arm64 plumelog_linux_arm64
          build darwin amd64 plumelog_darwin_amd64
          build darwin arm64 plumelog_darwin_arm64
          build windows amd64 plumelog_windows_amd64.exe
          (cd dist && sha256sum * > checksums.txt)
          ls -la dist
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          body: |
            Install options:
            - `go install github.com/xiaoxiaolin0918/plumelog-cli@${{ github.ref_name }}`
            - Or download a platform binary from the assets below and put it on your `PATH`.
